[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurosim"
version = "0.2.0.dev0"
description = "CPU computational neuroscience experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "pydantic>=2.10,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "build>=1,<2", "pip-audit>=2,<3", "ruff>=0.9,<1", "pyyaml>=6,<7"]
legacy = ["h5py", "plotly", "dash", "click", "pyyaml"]

[project.scripts]
neurosim = "neurosim.workbench.cli:main"
neurosim-serve = "neurosim.workbench.api:serve"

[tool.setuptools.packages.find]
where = ["python"]
include = ["neurosim*"]

[tool.setuptools.package-data]
"neurosim.workbench" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

name: CPU validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[dev]'
      - run: python -m pytest tests -q
      - run: python -m ruff check python/neurosim/omega_final.py python/neurosim/workbench tests/test_post_t210_remediation.py
      - run: python -m pip check
      - run: python -m build --wheel
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*.whl
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install . pip-audit
      - run: python -m pip_audit
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: tests
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker version && docker compose version
      - env:
          NEUROSIM_AUTH_TOKEN: release-ci-token-2026-verified
        run: docker compose -p neurosim-v020-ci --profile web down --volumes --remove-orphans
      - env:
          NEUROSIM_AUTH_TOKEN: release-ci-token-2026-verified
        run: docker compose -p neurosim-v020-ci --profile web build
      - env:
          NEUROSIM_AUTH_TOKEN: release-ci-token-2026-verified
        run: docker compose -p neurosim-v020-ci --profile web up -d --wait --wait-timeout 180
      - env:
          NEUROSIM_AUTH_TOKEN: release-ci-token-2026-verified
          NEUROSIM_COMPOSE_PROJECT: neurosim-v020-ci
        run: python scripts/smoke_docker_stack.py
      - if: always()
        env:
          NEUROSIM_AUTH_TOKEN: release-ci-token-2026-verified
        run: docker compose -p neurosim-v020-ci --profile web logs --no-color
      - if: always()
        env:
          NEUROSIM_AUTH_TOKEN: release-ci-token-2026-verified
        run: docker compose -p neurosim-v020-ci --profile web down --volumes --remove-orphans

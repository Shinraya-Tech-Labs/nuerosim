services:
  web:
    profiles: [web]
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - neurosim
    mem_limit: 1g
    restart: unless-stopped
  neurosim:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - experiments:/data
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2
volumes:
  experiments:

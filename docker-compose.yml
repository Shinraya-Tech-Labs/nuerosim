services:
  web:
    profiles: [web]
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - neurosim
    environment:
      NEUROSIM_AUTH_TOKEN: ${NEUROSIM_AUTH_TOKEN:?Set NEUROSIM_AUTH_TOKEN to a 16+ character secret}
    mem_limit: 1g
    restart: unless-stopped
  neurosim:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - experiments:/data
    environment:
      NEUROSIM_ALLOW_REMOTE: "1"
      NEUROSIM_AUTH_TOKEN: ${NEUROSIM_AUTH_TOKEN:?Set NEUROSIM_AUTH_TOKEN to a 16+ character secret}
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2
volumes:
  experiments:
